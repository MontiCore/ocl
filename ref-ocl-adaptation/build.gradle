/* (c) https://github.com/MontiCore/monticore */
plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

group = 'de.monticore.lang.ocl'

repositories {
    if(("true").equals(getProperty('useLocalRepo'))) {
        mavenLocal()
    }

    maven {
        url = sePublicRepo
    }

    mavenCentral()
}

dependencies {
  api(project(':'))

  implementation "de.se_rwth.commons:se-commons-logging:$se_commons_version"
  implementation "de.monticore:monticore-grammar:$mc_version"
  implementation "de.monticore:monticore-runtime:$mc_version"
  implementation "de.monticore.lang:cd4analysis:$mc_version"
  implementation "de.monticore.lang:cd4analysis:$mc_version:cddiff"

  implementation "org.apache.commons:commons-lang3:$commons_lang3_version"

  testImplementation "org.assertj:assertj-core:$assertj_version"
  testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version"
  testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_jupiter_version"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_jupiter_version"

  testImplementation project(path: ':', configuration: "testSources")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.headerOutputDirectory.convention(null)
    options.deprecation = false
    options.warnings = false
}

tasks.test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

publishing {
    repositories.maven {
        name = "$SE_Nexus_ID"
        credentials.username = mavenUser
        credentials.password = mavenPassword
        url = version.endsWith('SNAPSHOT') ? "$snapshotsRepoUrl" : "$releasesRepoUrl"
    }
}

